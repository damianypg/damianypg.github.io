@property --glow{syntax:"<color>"; inherits:true; initial-value:#2ee6ff}

:root{
  /* paleta cerrada: noche + 4 neones */
  --noche:#0b0820; --cian:#2ee6ff; --rosa:#ff4fd8; --lima:#c6ff4a; --ambar:#ffc845;
  --tinta:#f4f1ff; --tenue:rgba(244,241,255,.68); --sutil:rgba(244,241,255,.42);
  --rojo:#ff4d6d;                                   /* solo para errores */
  --superficie:rgba(26,20,62,.82); --superficie-2:rgba(255,255,255,.06); --borde:rgba(244,241,255,.12);
  --display:"Fiesta Display", "Montserrat", "Arial Black", system-ui, sans-serif;
  --texto:"Fiesta Texto", "Ubuntu", "Segoe UI", system-ui, sans-serif;
  --mono:"Fiesta Mono", "Ubuntu Mono", ui-monospace, Menlo, Consolas, monospace;
  --r-panel:30px; --r-ctrl:16px; --r-chip:999px;
  --resorte:cubic-bezier(.3,1.7,.5,1);
}
*{box-sizing:border-box}
html{font-size:clamp(15px, .8vw + 8px, 25px)}
body{
  margin:0; min-height:100vh; color:var(--tinta); background-color:var(--noche);
  font-family:var(--texto); font-weight:500; line-height:1.4; overflow-x:hidden;
  --glow:var(--cian); transition:--glow .9s ease;
  background-image:
    radial-gradient(70vw 65vh at 12% -12%, color-mix(in srgb, var(--glow) 24%, transparent), transparent 70%),
    radial-gradient(55vw 60vh at 108% 18%, rgba(255,79,216,.13), transparent 70%),
    radial-gradient(80vw 50vh at 50% 125%, color-mix(in srgb, var(--glow) 12%, transparent), transparent 70%),
    linear-gradient(180deg, #0b0820, #100b2c 55%, #0b0820);
  background-attachment:fixed;
}
body[data-tab="ver"],body[data-tab="crecimiento"]{--glow:var(--cian)}
body[data-tab="juego"],body[data-tab="codigo"]{--glow:var(--lima)}
body[data-tab="adivina"]{--glow:var(--ambar)}
body[data-tab="formula"]{--glow:var(--rosa)}
/* grano sutil */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.045;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>");
}
button{font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--ambar); outline-offset:3px}
.wrap{position:relative; z-index:1; max-width:1720px; margin:0 auto; padding:1rem clamp(16px,2vw,40px) 2rem}
.oculto{display:none !important}

/* ---------- cabecera ---------- */
.cabecera{display:flex; align-items:flex-end; justify-content:space-between; gap:1rem 2rem; flex-wrap:wrap; margin:.2rem 0 .9rem}
h1{
  margin:0; font-family:var(--display); font-weight:900; font-size:clamp(2.3rem, 4.1vw, 4.6rem); line-height:.95; letter-spacing:-.035em;
  text-shadow:0 0 28px color-mix(in srgb, var(--glow) 45%, transparent);
}
.sub{margin:.35rem 0 0; font-size:1.2rem; font-weight:600; color:var(--tenue)}
.serie{display:flex; gap:.35rem; margin:0; padding:0; list-style:none}
.serie li{
  display:flex; flex-direction:column; align-items:center; min-width:3.2rem; padding:.35rem .5rem; border-radius:14px;
  border:1px solid var(--borde); background:var(--superficie-2); transition:transform .35s var(--resorte), border-color .3s, background .3s;
}
.serie span{font-size:.72rem; color:var(--sutil); font-weight:700}
.serie b{font-family:var(--display); font-size:1.15rem; line-height:1.1; font-variant-numeric:tabular-nums}
.serie li.on{border-color:var(--glow); background:color-mix(in srgb, var(--glow) 18%, transparent); transform:translateY(-4px)}
.serie li.on b{color:var(--glow)}

/* ---------- pestañas ---------- */
nav{
  display:flex; gap:.4rem; padding:.4rem; margin-bottom:1rem; width:max-content; max-width:100%; overflow-x:auto; scrollbar-width:none;
  border-radius:var(--r-chip); background:var(--superficie); border:1px solid var(--borde);
}
nav::-webkit-scrollbar{display:none}
.tab{
  flex:none; border:1.5px solid transparent; background:transparent; border-radius:var(--r-chip); padding:.5rem 1.15rem;
  font-size:1.1rem; font-weight:700; color:var(--tenue); transition:color .2s, background .25s, border-color .25s, transform .15s;
}
.tab:hover{color:var(--tinta); background:var(--superficie-2)}
.tab:active{transform:scale(.95)}
.tab.on{color:var(--tinta); border-color:var(--glow); background:color-mix(in srgb, var(--glow) 20%, transparent); box-shadow:0 0 22px color-mix(in srgb, var(--glow) 35%, transparent)}

/* ---------- superficies ---------- */
/* vidrio sin backdrop-filter: el desenfoque real obligaba a repintar toda la pantalla en cada frame (8 fps) */
.vidrio{background:linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,0) 40%), var(--superficie); border:1px solid var(--borde); border-radius:var(--r-panel); box-shadow:0 30px 80px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08)}
.dos{display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:1.2rem; align-items:start}
.escenario{padding:.6rem; position:relative}
#stage{display:block; width:100%; max-height:max(340px, calc(100vh - 16.5rem)); aspect-ratio:1; margin:0 auto; user-select:none; -webkit-user-select:none; touch-action:manipulation}
#stageCap{text-align:center; font-size:1.15rem; font-weight:700; color:var(--tenue); min-height:1.7em}
.panel{padding:1.3rem 1.5rem; display:flex; flex-direction:column; gap:1rem; min-width:0}
.ancho{padding:1.5rem}
.entra{animation:entrar .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes entrar{from{opacity:0; transform:translateY(12px)}}
@media (max-width:1000px){ .dos{grid-template-columns:1fr} #stage{max-height:none} }
@media (max-width:700px){ .serie{display:none} .panel{padding:1.1rem} .ancho{padding:1.1rem} }

/* ---------- chips n ---------- */
.nsel{display:flex; align-items:center; gap:.6rem 1rem; flex-wrap:wrap}
.chips{display:flex; gap:.4rem; flex-wrap:wrap}
.chip{
  width:2.7rem; height:2.7rem; border-radius:50%; border:1.5px solid var(--borde); background:var(--superficie-2);
  font-family:var(--display); font-size:1.2rem; transition:transform .25s var(--resorte), background .2s, border-color .2s, color .2s;
}
.chip:hover{transform:scale(1.12); border-color:var(--glow)}
.chip:active{transform:scale(.92)}
.chip.on{background:var(--glow); color:var(--noche); border-color:var(--glow); box-shadow:0 0 20px color-mix(in srgb, var(--glow) 60%, transparent)}
.ninfo{font-size:1.25rem; font-weight:700; color:var(--tenue)}
.ninfo b{font-family:var(--display); color:var(--tinta); font-weight:900}

/* ---------- botones ---------- */
.btns{display:flex; gap:.55rem; flex-wrap:wrap}
.btn{
  border:1.5px solid var(--borde); background:var(--superficie-2); border-radius:var(--r-ctrl);
  padding:.65rem 1.1rem; font-size:1.08rem; font-weight:700; transition:transform .18s var(--resorte), background .2s, border-color .2s, box-shadow .2s;
}
.btn:hover{transform:translateY(-2px); background:rgba(255,255,255,.11); border-color:rgba(244,241,255,.35)}
.btn:active{transform:translateY(1px) scale(.96)}
.btn.prim{background:var(--glow); color:var(--noche); border-color:transparent; box-shadow:0 8px 28px color-mix(in srgb, var(--glow) 40%, transparent)}
.btn.prim:hover{box-shadow:0 10px 34px color-mix(in srgb, var(--glow) 60%, transparent)}
.btn[disabled]{opacity:.4; pointer-events:none}

<script>
// ==LOGICA==

// combinaciones(n, k): ¿de cuántas formas puedo escoger k cosas entre n?
function combinaciones(n, k) {
  // empezamos con 1 y vamos multiplicando
  // y dividiendo poquito a poco
  let r = 1;
  for (let i = 1; i <= k; i++) {
    r = r * (n - k + i) / i;
  }
  // redondeamos para borrar decimales raros
  return Math.round(r);
}

// catalan(n): número de formas de que 2n personas se den la mano sin cruzarse
function catalan(n) {
  // combinaciones de 2n tomando n,
  // dividido para n + 1
  return combinaciones(2 * n, n) / (n + 1);
}

// generar(personas): devuelve TODAS las formas de darse la mano sin cruzarse
// personas = lista de números, por ejemplo [0, 1, 2, 3]
// cada forma = lista de pares, por ejemplo [[0, 3], [1, 2]]
function generar(personas) {
  // si no hay nadie: 1 sola forma (no hacer nada)
  if (personas.length === 0) return [[]];

  const formas = [];
  const primero = personas[0];

  // la primera persona elige pareja saltando
  // de 2 en 2 (k = 1, 3, 5...): así a cada lado
  // queda un número PAR y nadie queda solo
  for (let k = 1; k < personas.length; k += 2) {
    const pareja = personas[k];

    // los que quedan DENTRO del apretón
    const dentro = generar(personas.slice(1, k));
    // los que quedan FUERA (después de la pareja)
    const fuera = generar(personas.slice(k + 1));

    // cada forma de adentro con cada forma de afuera
    for (const a of dentro) {
      for (const b of fuera) {
        formas.push([[primero, pareja], ...a, ...b]);
      }
    }
  }
  return formas;
}

// ==FIN LOGICA==

/* ======================================================================
   Validación del juego
   ====================================================================== */
// ==VALIDACION==
// dos pares p<q y x<y se cruzan si uno empieza dentro del otro y termina fuera
function cruzan(p, q, x, y) {
  return (x < p && p < y && y < q) || (p < x && x < q && q < y);
}

// probar(pares, a, b): ¿se puede agregar el apretón a🤝b a los pares que ya están?
// devuelve {ok: true} o {ok: false, tipo: 'misma' | 'ocupada' | 'cruce' | 'paridad', ...}
function probar(pares, a, b) {
  if (a === b) return { ok: false, tipo: 'misma' };
  const ocupada = [a, b].find(p => pares.some(([x, y]) => x === p || y === p));
  if (ocupada !== undefined) return { ok: false, tipo: 'ocupada', persona: ocupada };
  const p = Math.min(a, b), q = Math.max(a, b);
  const choque = pares.find(([x, y]) => cruzan(p, q, Math.min(x, y), Math.max(x, y)));
  if (choque) return { ok: false, tipo: 'cruce', choque };
  const entre = q - p - 1;                 // personas entre las dos
  if (entre % 2 === 1) return { ok: false, tipo: 'paridad', entre };
  return { ok: true };
}
// ==FIN VALIDACION==

/* ======================================================================
   Dibujo, animaciones e interacción
   ====================================================================== */
const EMOJIS = ['😀','😎','🤠','🥳','🤓','😺','🐼','🦊','🐸','🐵','🦄','🐙','🐧','🦁'];
const COLORES = ['#2ee6ff','#ff4fd8','#c6ff4a','#ffc845'];       // cian, rosa, lima, ámbar
const colorDe = i => COLORES[i % COLORES.length];                 // vecinos siempre de distinto color
const SVGNS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
const C = 300; // centro del escenario (viewBox 600x600)

const S = {
  tab:'ver', n:3, cache:{}, timers:[], raf:0,
  ver:{idx:0, play:false},
  juego:{pares:[], sel:null, bloqueado:false, encontradas:{}},
  adiv:{corriendo:false, revelado:false},
  form:{sumando:false},
  crec:{log:true}
};

const fmt = x => String(x).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const ordenar = f => f.map(([a,b]) => a<b ? [a,b] : [b,a]).sort((p,q) => p[0]-q[0]);
const clave = f => ordenar(f).map(p => p.join('-')).join('|');
const rango = N => Array.from({length:N}, (_,i) => i);
function soluciones(n){
  if (!S.cache[n]) S.cache[n] = generar(rango(2*n)).map(ordenar);
  return S.cache[n];
}

/* ---------- temporizadores (se detienen al cambiar de pestaña o de n) ---------- */
function despues(fn, ms){ const t = setTimeout(fn, ms); S.timers.push(t); return t; }
function cada(fn, ms){ const t = setInterval(fn, ms); S.timers.push(t); return t; }
function pararTodo(){
  S.timers.forEach(t => { clearTimeout(t); clearInterval(t); });
  S.timers = [];
  cancelAnimationFrame(S.raf);
  S.ver.play = false; S.adiv.corriendo = false; S.form.sumando = false;
}

/* ---------- geometría ---------- */
function geom(n){
  const N = 2*n, R = 215, pr = Math.min(44, 270/N + 8);
  const pts = rango(N).map(i => {
    const a = -Math.PI/2 + 2*Math.PI*i/N;   // persona 1 arriba, sentido horario
    return {x:C + R*Math.cos(a), y:C + R*Math.sin(a), lx:C + (R+pr+24)*Math.cos(a), ly:C + (R+pr+24)*Math.sin(a)};
  });
  return {N, R, pr, pts};
}
function curva(pts, a, b, cx=C, k=.4){
  const p = pts[a], q = pts[b];
  const mx = (p.x+q.x)/2, my = (p.y+q.y)/2;
  const kx = cx + (mx-cx)*k, ky = cx + (my-cx)*k;           // punto de control, jalado al centro
  return {
    p, q, kx, ky,
    d:`M${p.x.toFixed(1)} ${p.y.toFixed(1)} Q${kx.toFixed(1)} ${ky.toFixed(1)} ${q.x.toFixed(1)} ${q.y.toFixed(1)}`,
    mx:.25*p.x + .5*kx + .25*q.x, my:.25*p.y + .5*ky + .25*q.y   // punto medio de la Bézier
  };
}
// degradado entre los colores de las dos personas. userSpaceOnUse: funciona aunque la curva sea una recta
const degradado = (id, c, a, b) =>
  `<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${c.p.x.toFixed(1)}" y1="${c.p.y.toFixed(1)}" x2="${c.q.x.toFixed(1)}" y2="${c.q.y.toFixed(1)}"><stop offset="0" stop-color="${colorDe(a)}"/><stop offset="1" stop-color="${colorDe(b)}"/></linearGradient>`;

/* ---------- escenario principal ---------- */
// o.animar: 'todo' | 'ultima' | 'nada'; o.sel: persona elegida; o.marcas: {i:'dentro'|'fuera'|'uno'};
// o.centro: texto gigante al centro; o.mesa: texto de la mesa (por defecto "C(n) = X")
function dibujar(n, pares, o = {}){
  const g = geom(n);
  const pareada = new Set(pares.flat());
  const curvas = pares.map(([a,b]) => curva(g.pts, a, b));
  let h = `<defs>
    ${COLORES.map((c,i) => `<radialGradient id="aura${i}"><stop offset="0" stop-color="${c}" stop-opacity=".55"/><stop offset=".55" stop-color="${c}" stop-opacity=".15"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient>`).join('')}
    <radialGradient id="aura-lima"><stop offset="0" stop-color="#c6ff4a" stop-opacity=".9"/><stop offset="1" stop-color="#c6ff4a" stop-opacity="0"/></radialGradient>
    <radialGradient id="aura-ambar"><stop offset="0" stop-color="#ffc845" stop-opacity=".9"/><stop offset="1" stop-color="#ffc845" stop-opacity="0"/></radialGradient>
    <radialGradient id="mesa"><stop offset="0" stop-color="#ffffff" stop-opacity=".09"/><stop offset="1" stop-color="#ffffff" stop-opacity=".02"/></radialGradient>
    <radialGradient id="flash"><stop offset="0" stop-color="#ffffff" stop-opacity=".9"/><stop offset=".4" stop-color="#c6ff4a" stop-opacity=".35"/><stop offset="1" stop-color="#c6ff4a" stop-opacity="0"/></radialGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2ee6ff"/><stop offset="1" stop-color="#ff4fd8"/></linearGradient>
    ${curvas.map((c,i) => degradado('dg'+i, c, pares[i][0], pares[i][1])).join('')}
  </defs>
  <circle class="guia" cx="${C}" cy="${C}" r="${g.R}"/>
  <g class="mesa"><circle class="mesa-base" cx="${C}" cy="${C}" r="112"/><circle class="mesa-anillo" cx="${C}" cy="${C}" r="126"/></g>`;
  if (o.centro) h += `<text class="centro" x="${C}" y="${C-22}">${o.centro}</text>`;
  h += '<g id="curvas">';
  let manos = '';
  curvas.forEach((c, i) => {
    const anima = o.animar === 'todo' || (o.animar === 'ultima' && i === pares.length-1);
    const dl = o.animar === 'todo' ? i*.16 : 0;
    const cls = anima ? 'dibuja' : '';
    // brillo = segundo trazo grueso y translúcido debajo (sin filter: una recta vertical tiene bbox de ancho 0 y desaparecería)
    h += `<g class="apreton" data-a="${pares[i][0]}" data-b="${pares[i][1]}">
      <path d="${c.d}" pathLength="1" class="halo ${cls}" stroke="url(#dg${i})" style="animation-delay:${dl}s"/>
      <path d="${c.d}" pathLength="1" class="curva ${cls}" stroke="url(#dg${i})" style="animation-delay:${dl}s"/></g>`;
    manos += `<text class="mano ${anima ? 'pop' : ''}" data-a="${pares[i][0]}" data-b="${pares[i][1]}" x="${c.mx.toFixed(1)}" y="${c.my.toFixed(1)}" style="animation-delay:${dl+.5}s">🤝</text>`;
  });
  const lugar = lugarLetrero(curvas, !!o.centro);
  h += `</g><g class="letrero" transform="translate(${lugar.x} ${lugar.y})"><rect x="-88" y="-24" width="176" height="48" rx="24"/>
    <text class="mesa-txt">${o.mesa ?? `C(${n}) = <tspan class="v">${fmt(catalan(n))}</tspan>`}</text></g>`;
  h += `<g id="manos">${manos}</g>`;
  h += '<g id="personas">';
  g.pts.forEach((p, i) => {
    const m = o.marcas && o.marcas[i];
    const cls = [o.sel === i ? 'sel' : '', m || '', pareada.has(i) ? 'pareada' : ''].join(' ');
    h += `<g class="persona ${cls}" data-i="${i}">
      <circle class="aura" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${(g.pr*1.75).toFixed(1)}" fill="url(#aura${i % COLORES.length})"/>
      <g class="cuerpo-g">
        <circle class="cuerpo" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${g.pr.toFixed(1)}" stroke="${colorDe(i)}"/>
        <text class="cara" x="${p.x.toFixed(1)}" y="${(p.y+2).toFixed(1)}" font-size="${(g.pr*1.15).toFixed(0)}">${EMOJIS[i]}</text>
      </g>
      <text class="num" x="${p.lx.toFixed(1)}" y="${p.ly.toFixed(1)}">${i+1}</text>
    </g>`;
  });
  h += '</g>';
  const svg = $('#stage');
  svg.innerHTML = h;
  svg.classList.toggle('clic', !!o.clic);
}
// el letrero "C(n) = X" va donde menos estorbe: primero, lejos de los 🤝; después, lejos de las curvas
function lugarLetrero(curvas, conCentro){
  if (conCentro) return {x:C, y:C+72};
  const W = 88, H = 24;                                   // medio ancho y medio alto del letrero
  const dist = (px, py, x, y) => Math.hypot(Math.max(Math.abs(px - x) - W, 0), Math.max(Math.abs(py - y) - H, 0));
  let mejor = null;
  for (const dy of [70, -70, 0, 40, -40, 95, -95, 20, -20, 60, -60])
    for (const dx of [0, -30, 30, -55, 55]){
      if (Math.hypot(dx, dy) > 105) continue;
      const x = C + dx, y = C + dy;
      let manos = Infinity, lineas = Infinity;
      for (const c of curvas){
        manos = Math.min(manos, dist(c.mx, c.my, x, y) - 20);
        for (let k = 0; k <= 24; k++){
          const t = k/24, u = 1-t;
          lineas = Math.min(lineas, dist(u*u*c.p.x + 2*u*t*c.kx + t*t*c.q.x, u*u*c.p.y + 2*u*t*c.ky + t*t*c.q.y, x, y));
        }
      }
      const puntaje = [Math.min(manos, 0), Math.min(lineas, 30), -Math.hypot(dx, dy - 70)];
      if (!mejor || puntaje[0] > mejor.p[0] || (puntaje[0] === mejor.p[0] && (puntaje[1] > mejor.p[1] || (puntaje[1] === mejor.p[1] && puntaje[2] > mejor.p[2])))) mejor = {x, y, p:puntaje};
    }
  return mejor;
}
const leyenda = txt => { $('#stageCap').innerHTML = txt || ''; };
function destello(){
  const c = document.createElementNS(SVGNS, 'circle');
  c.setAttribute('class', 'destello');
  c.setAttribute('cx', C); c.setAttribute('cy', C); c.setAttribute('r', 300); c.setAttribute('fill', 'url(#flash)');
  $('#stage').appendChild(c);
  setTimeout(() => c.remove(), 1000);
}

/* ---------- miniaturas (degradados compartidos en #defsMini) ---------- */
let miniN = 0;
const ptsMini = n => rango(2*n).map(i => {
  const a = -Math.PI/2 + 2*Math.PI*i/(2*n);
  return {x:50 + 40*Math.cos(a), y:50 + 40*Math.sin(a)};
});
function prepararMinis(n){
  if (miniN === n) return;
  miniN = n;
  const pts = ptsMini(n); let h = '';
  for (let a = 0; a < 2*n; a++) for (let b = a+1; b < 2*n; b++) h += degradado(`m${a}-${b}`, curva(pts, a, b, 50), a, b);
  $('#defsMini').innerHTML = `<defs>${h}</defs>`;
}
function mini(n, pares){
  prepararMinis(n);
  const pts = ptsMini(n), N = 2*n;
  let h = '<svg viewBox="0 0 100 100" aria-hidden="true">';
  pares.forEach(([a,b]) => { h += `<path d="${curva(pts, a, b, 50).d}" fill="none" stroke="url(#m${Math.min(a,b)}-${Math.max(a,b)})" stroke-width="4.5" stroke-linecap="round"/>`; });
  pts.forEach((p, i) => { h += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${N > 10 ? 4 : 5.5}" fill="${colorDe(i)}"/>`; });
  return h + '</svg>';
}
const textoPares = pares => pares.map(([a,b]) => `<span class="par" style="--a:${colorDe(a)};--b:${colorDe(b)}"><b>${a+1}</b>🤝<b>${b+1}</b></span>`).join('');

/* ---------- selector de n y serie de la cabecera ---------- */
function selectorN(){
  return `<div class="nsel">
    <div class="chips" role="group" aria-label="Elegir n">${rango(7).map(k => `<button class="chip ${k+1 === S.n ? 'on' : ''}" data-n="${k+1}" aria-label="n = ${k+1}">${k+1}</button>`).join('')}</div>
    <div class="ninfo"><b>${2*S.n}</b> personas · C(${S.n}) = <b>${fmt(catalan(S.n))}</b></div>
  </div>`;
}
function serie(){
  const activo = {ver:S.n, juego:S.n, formula:S.n, adivina:6}[S.tab];
  $('#serie').innerHTML = rango(8).map(n => `<li class="${n === activo ? 'on' : ''}"><span>C(${n})</span><b>${fmt(catalan(n))}</b></li>`).join('');
}

/* ---------- confeti ---------- */
function confeti(cuantos = 90){
  const box = $('#confeti'), em = ['🎉','✨','🤝','⭐'];
  for (let i = 0; i < cuantos; i++){
    const s = document.createElement('span');
    s.textContent = em[i % em.length];
    s.style.left = Math.random()*100 + 'vw';
    s.style.fontSize = (1.2 + Math.random()*2.2) + 'rem';
    s.style.animationDuration = (2.4 + Math.random()*2.4) + 's';
    s.style.animationDelay = Math.random()*1.2 + 's';
    box.appendChild(s);
    setTimeout(() => s.remove(), 6000);
  }
}
function saltar(el){ el.classList.remove('salta'); void el.offsetWidth; el.classList.add('salta'); }

/* ======================================================================
   VISTA 1: VER
   ====================================================================== */
function vistaVer(){
  const sols = soluciones(S.n);
  S.ver.idx = Math.min(S.ver.idx, sols.length-1);
  $('#panel').innerHTML = `
    ${selectorN()}
    <div class="marcador"><span class="grande" id="vIdx">1</span><span class="de">de <b>${fmt(sols.length)}</b> formas</span></div>
    <div class="pares" id="vPares"></div>
    <div class="btns">
      <button class="btn" id="vPrev">⏮ Anterior</button>
      <button class="btn prim" id="vPlay">▶ Reproducir</button>
      <button class="btn" id="vNext">Siguiente ⏭</button>
      <button class="btn" id="vRand">🎲 Al azar</button>
    </div>
    <p class="hint">Atajos: <kbd>←</kbd> <kbd>→</kbd> para moverse, <kbd>Espacio</kbd> para reproducir.</p>
    <h3>Todas las formas</h3>
    <div class="galeria" id="vGal">${sols.map((f,i) => `<button class="mini" data-k="${i}" aria-label="Forma ${i+1}"><small>${i+1}</small>${mini(S.n, f)}</button>`).join('')}</div>`;
  $('#vPrev').onclick = () => verIr(S.ver.idx - 1);
  $('#vNext').onclick = () => verIr(S.ver.idx + 1);
  $('#vRand').onclick = () => {
    const L = sols.length; if (L < 2) return verIr(0);
    let r; do { r = Math.floor(Math.random()*L); } while (r === S.ver.idx);
    verIr(r);
  };
  $('#vPlay').onclick = verPlay;
  $('#vGal').onclick = e => { const m = e.target.closest('.mini'); if (m) verIr(+m.dataset.k); };
  verIr(S.ver.idx);
}
// solo actualiza lo necesario: escenario, contador, pares y resaltado de la galería
function verIr(i){
  const sols = soluciones(S.n), L = sols.length;
  i = ((i % L) + L) % L;
  S.ver.idx = i;
  dibujar(S.n, sols[i], {animar:'todo'});
  leyenda(`${2*S.n} personas · ${S.n} ${S.n > 1 ? 'apretones' : 'apretón'}`);
  const num = $('#vIdx'); num.textContent = i+1; saltar(num);
  $('#vPares').innerHTML = textoPares(sols[i]);
  const gal = $('#vGal');
  gal.querySelector('.mini.on')?.classList.remove('on');
  const m = gal.querySelector(`[data-k="${i}"]`);
  m.classList.add('on');
  if (m.offsetTop < gal.scrollTop) gal.scrollTop = m.offsetTop - 8;
  else if (m.offsetTop + m.offsetHeight > gal.scrollTop + gal.clientHeight) gal.scrollTop = m.offsetTop + m.offsetHeight - gal.clientHeight + 8;
}
function verPlay(){
  if (S.ver.play){ pararTodo(); $('#vPlay').textContent = '▶ Reproducir'; return; }
  pararTodo();
  S.ver.play = true;
  $('#vPlay').textContent = '⏸ Pausa';
  cada(() => verIr(S.ver.idx + 1), 1100);
}

   VISTA 2: JUEGO
   ====================================================================== */
const VACIA_JUEGO = '<div class="vacia">Todavía no hay formas. ¡La primera la pone el público! 🙋</div>';
function vistaJuego(){
  const J = S.juego;
  J.pares = []; J.sel = null; J.bloqueado = false;
  if (!J.encontradas[S.n]) J.encontradas[S.n] = new Map();
  $('#panel').innerHTML = `
    ${selectorN()}
    <div class="marcador"><span class="de">Encontraste</span><span class="grande" id="jCount">0</span><span class="de">de <b>${fmt(catalan(S.n))}</b></span></div>
    <div class="barra"><div id="jBar"></div></div>
    <div class="msg" id="jMsg"></div>
    <div class="btns">
      <button class="btn" id="jUndo">↩ Deshacer</button>
      <button class="btn" id="jReset">🔄 Reiniciar intento</button>
      <button class="btn" id="jClear">🧹 Borrar lo encontrado</button>
    </div>
    <h3>Lo que encontraste</h3>
    <div class="galeria" id="jGal"></div>`;
  $('#jUndo').onclick = () => {
    if (J.bloqueado) return;
    if (!J.pares.length && J.sel === null) return mensaje('No hay nada que deshacer todavía 🙂');
    J.pares.pop(); J.sel = null; juegoDibujar('nada'); mensaje('Listo, deshice el último apretón ↩');
  };
  $('#jReset').onclick = () => { if (J.bloqueado) return; J.pares = []; J.sel = null; juegoDibujar('nada'); mensaje('Intento limpio. ¡Toca a dos personas! 👆'); };
  $('#jClear').onclick = () => {
    if (J.bloqueado) return;
    J.encontradas[S.n] = new Map(); juegoContador(); $('#jGal').innerHTML = VACIA_JUEGO;
    mensaje('Empezamos de cero. ¿Quién se anima? 🙋');
  };
  juegoContador(false);
  const ya = [...J.encontradas[S.n].values()];
  $('#jGal').innerHTML = ya.length ? ya.map((f,i) => `<div class="mini" data-key="${clave(f)}"><small>${i+1}</small>${mini(S.n, f)}</div>`).join('') : VACIA_JUEGO;
  juegoDibujar('nada');
  mensaje('Toca a dos personas para que se den la mano 🤝');
}
function juegoDibujar(animar){
  dibujar(S.n, S.juego.pares, {animar, sel:S.juego.sel, clic:true});
  leyenda(`Apretones: ${S.juego.pares.length} de ${S.n}`);
}
function mensaje(txt, tipo = ''){
  const m = $('#jMsg'); m.className = 'msg ' + tipo; m.innerHTML = txt;
  void m.offsetWidth; m.classList.add('cambia');
}
function juegoContador(anim = true){
  const k = S.juego.encontradas[S.n].size, total = catalan(S.n);
  const el = $('#jCount'); el.textContent = k; if (anim) saltar(el);
  $('#jBar').style.width = (100*k/total) + '%';
}
function parejaDe(i){ const p = S.juego.pares.find(([a,b]) => a === i || b === i); return p ? (p[0] === i ? p[1] : p[0]) : null; }
function sacudirPersona(i){
  const el = $(`#stage .persona[data-i="${i}"]`); if (!el) return;
  el.classList.remove('nope'); void el.getBBox(); el.classList.add('nope');
}
function tocar(i){
  const J = S.juego;
  if (J.bloqueado) return;
  const pj = parejaDe(i);
  if (pj !== null){ mensaje(`La persona ${i+1} ya está dándole la mano a la ${pj+1} 🙅 Elige a alguien libre.`, 'mal'); sacudirPersona(i); return; }
  if (J.sel === null){ J.sel = i; juegoDibujar('nada'); mensaje(`Persona ${i+1} lista ${EMOJIS[i]} ¿Con quién se da la mano?`); return; }
  if (J.sel === i){ J.sel = null; juegoDibujar('nada'); mensaje('Cancelado. Elige a otra persona 👆'); return; }
  const a = Math.min(J.sel, i), b = Math.max(J.sel, i);
  J.sel = null;
  const r = probar(J.pares, a, b);
  if (!r.ok && r.tipo === 'cruce') return apretonMalo(a, b, `💥 ¡Choque de brazos! ${a+1}🤝${b+1} se cruza con ${r.choque[0]+1}🤝${r.choque[1]+1}`);
  if (!r.ok && r.tipo === 'paridad') return apretonMalo(a, b, `😢 Entre ${a+1} y ${b+1} hay ${r.entre} persona${r.entre > 1 ? 's' : ''}: alguien se quedaría sin pareja`);
  if (!r.ok) return;
  J.pares.push([a, b]);
  juegoDibujar('ultima');
  if (J.pares.length < S.n) { mensaje(`¡Eso! ${a+1}🤝${b+1}. Falta${S.n - J.pares.length > 1 ? 'n' : ''} ${S.n - J.pares.length} 👏`, 'ok'); return; }
  completar();
}
function apretonMalo(a, b, txt){
  const J = S.juego;
  juegoDibujar('nada');
  mensaje(txt, 'mal');
  const c = curva(geom(S.n).pts, a, b);
  const g = document.createElementNS(SVGNS, 'g');
  g.setAttribute('class', 'mala');
  g.innerHTML = `<path d="${c.d}" pathLength="1" class="halo roja dibuja" style="animation-duration:.25s"/><path d="${c.d}" pathLength="1" class="curva roja dibuja" style="animation-duration:.25s"/><text class="boom" x="${c.mx.toFixed(1)}" y="${c.my.toFixed(1)}">💥</text>`;
  $('#curvas').appendChild(g);
  J.bloqueado = true;
  despues(() => { g.remove(); J.bloqueado = false; }, 800);
}
function completar(){
  const J = S.juego, mapa = J.encontradas[S.n], k = clave(J.pares), total = catalan(S.n);
  J.bloqueado = true;
  destello();
  if (!mapa.has(k)){
    mapa.set(k, ordenar(J.pares));
    juegoContador();
    const gal = $('#jGal');
    gal.querySelector('.vacia')?.remove();
    const d = document.createElement('div');
    d.className = 'mini flash'; d.dataset.key = k;
    d.innerHTML = `<small>${mapa.size}</small>${mini(S.n, J.pares)}`;
    gal.appendChild(d);
    gal.scrollTop = gal.scrollHeight;
    if (mapa.size === total){ mensaje('¡LAS ENCONTRASTE TODAS! 🏆', 'wow'); confeti(120); }
    else mensaje(`¡Nueva forma! 🎉 Van ${mapa.size} de ${total}`, 'ok');
  } else {
    mensaje('Esa ya la tenías 🔁 ¡Busca otra!', 'mal');
    const m = $(`#jGal [data-key="${k}"]`);
    if (m){ m.classList.remove('flash'); void m.offsetWidth; m.classList.add('flash'); m.scrollIntoView({block:'nearest'}); }
  }
  despues(() => { J.pares = []; J.sel = null; J.bloqueado = false; juegoDibujar('nada'); }, 1300);
}

   VISTA 3: ADIVINA (n = 6)
   ====================================================================== */
const N_ADIV = 6;
function vistaAdivina(){
  const pistas = [2,3,4,5].map(k => `<span class="pista">${2*k} personas → <b>${catalan(k)}</b></span>`).join('');
  $('#panel').innerHTML = `
    <p class="pregunta">${2*N_ADIV} personas en círculo se dan la mano sin cruzar los brazos…<big>¿De cuántas formas?</big></p>
    <div><h3>Pista</h3><div class="pistas">${pistas}<span class="pista q">${2*N_ADIV} personas → <b>¿?</b></span></div></div>
    <div class="fila">
      <input type="number" id="aIn" min="0" step="1" placeholder="?" aria-label="Tu respuesta">
      <button class="btn prim" id="aBtn">¡Revelar!</button>
      <button class="btn oculto" id="aOtra">🔁 Intentar de nuevo</button>
    </div>
    <div class="gigante" id="aNum">?</div>
    <div class="msg" id="aMsg">Escribe tu número (¡o que el público vote!) y presiona ¡Revelar!</div>
    <p class="extra oculto" id="aExtra">Con 20 personas (n = 10) ya son <b>${fmt(catalan(10))}</b></p>`;
  adivReposo();
  $('#aBtn').onclick = revelar;
  $('#aIn').onkeydown = e => { if (e.key === 'Enter') revelar(); };
  $('#aOtra').onclick = () => {
    pararTodo();
    S.adiv.revelado = false;
    $('#aIn').value = ''; $('#aNum').textContent = '?'; $('#aNum').classList.remove('fin');
    $('#aBtn').disabled = false; $('#aIn').disabled = false;
    $('#aOtra').classList.add('oculto'); $('#aExtra').classList.add('oculto');
    const m = $('#aMsg'); m.className = 'msg'; m.textContent = '¡Otra ronda! Escribe tu número y presiona ¡Revelar!';
    adivReposo(); $('#aIn').focus();
  };
}
function adivReposo(){ dibujar(N_ADIV, [], {centro:'?', mesa:`C(${N_ADIV}) = <tspan class="v">?</tspan>`}); leyenda(`${2*N_ADIV} personas esperando…`); }
function revelar(){
  if (S.adiv.corriendo || S.adiv.revelado) return;
  const sols = soluciones(N_ADIV), total = sols.length;
  const txt = $('#aIn').value.trim(), intento = txt === '' ? null : Number(txt);
  S.adiv.corriendo = true;
  $('#aBtn').disabled = true; $('#aIn').disabled = true;
  const m = $('#aMsg'); m.className = 'msg'; m.textContent = 'Contando… 🥁';
  const t0 = performance.now(), DUR = 3200;
  let ultimo = -1e9, k = 0;
  const paso = ahora => {
    const t = Math.min(1, (ahora - t0) / DUR);
    const e = 1 - Math.pow(1 - t, 3);                       // easing: rápido al inicio, lento al final
    const v = Math.max(1, Math.round(1 + (total - 1) * e));
    $('#aNum').textContent = v;
    if (ahora - ultimo > 85 || t === 1){                   // ráfaga de soluciones en el escenario
      ultimo = ahora;
      k = t === 1 ? total - 1 : (k + 1 + Math.floor(Math.random()*7)) % total;
      dibujar(N_ADIV, sols[k], {animar:'nada', mesa:`C(${N_ADIV}) = <tspan class="v">${v}</tspan>`});
      leyenda(`Forma ${v} de ${total}`);
    }
    if (t < 1) { S.raf = requestAnimationFrame(paso); return; }
    S.adiv.corriendo = false; S.adiv.revelado = true;
    $('#aNum').classList.add('fin');
    dibujar(N_ADIV, sols[k], {animar:'todo'});
    destello();
    if (intento === total){ m.className = 'msg wow'; m.textContent = '¡EXACTO! 🤯'; confeti(120); }
    else if (intento === null || Number.isNaN(intento)){ m.className = 'msg ok'; m.textContent = `¡Son ${total} formas! 😮 La próxima, ¡anímate a adivinar!`; }
    else if (intento > total){ m.className = 'msg mal'; m.textContent = `Te pasaste por ${fmt(intento - total)} 😅 (dijiste ${fmt(intento)})`; }
    else { m.className = 'msg mal'; m.textContent = `Te quedaste corto por ${fmt(total - intento)} 😅 (dijiste ${fmt(intento)})`; }
    $('#aOtra').classList.remove('oculto');
    $('#aExtra').classList.remove('oculto');
  };
  S.raf = requestAnimationFrame(paso);
}

/* ======================================================================
   VISTA 4: FÓRMULA (la recurrencia)
   ====================================================================== */
function opcionesFormula(n){
  const N = 2*n, ops = [];
  for (let j = 1; j < N; j += 2){            // pareja en posición par: 2, 4, 6…
    const i = j - 1, d = N - j - 1;
    ops.push({j, i, d, a:catalan(i/2), b:catalan(d/2)});
  }
  return ops;
}
function vistaFormula(){
  const n = S.n, ops = opcionesFormula(n);
  const filas = ops.map((o, idx) => `
    <button class="opcion" data-idx="${idx}">
      <span class="quien">Persona 1 con la ${o.j+1}:</span>
      <span class="grupo d">${o.i} personas → C(${o.i/2}) = ${o.a}</span> ×
      <span class="grupo f">${o.d} personas → C(${o.d/2}) = ${o.b}</span>
      = <span class="prod">${fmt(o.a*o.b)}</span>
    </button>`).join('');
  $('#panel').innerHTML = `
    ${selectorN()}
    <p class="hint" style="font-size:1.08rem; color:var(--tenue)">La persona 1 elige pareja. Cada lado queda como el mismo problema, pero más chiquito 🪄</p>
    <div class="leyenda"><span class="l1">Persona 1</span><span class="ld">Adentro</span><span class="lf">Afuera</span></div>
    <div class="opciones" id="fOps">${filas}</div>
    <div class="suma" id="fSuma"></div>
    <p class="verif">Fórmula: C(${2*n},${n})/(${n}+1) = ${fmt(combinaciones(2*n, n))}/${n+1} = ${fmt(catalan(n))} ✔</p>
    <div class="btns"><button class="btn prim" id="fIr">▶ Ir sumando</button></div>`;
  $('#fOps').onclick = e => {
    const b = e.target.closest('.opcion'); if (!b) return;
    if (S.form.sumando){ pararTodo(); $('#fIr').textContent = '▶ Ir sumando'; }
    formulaElegir(+b.dataset.idx);
  };
  $('#fIr').onclick = irSumando;
  formulaElegir(0);
}
// sumadas: cuántos términos van sumados (por defecto todos)
function formulaElegir(idx, sumadas){
  const n = S.n, ops = opcionesFormula(n), o = ops[idx], marcas = {0:'uno'};
  for (let p = 1; p < 2*n; p++) if (p !== o.j) marcas[p] = p < o.j ? 'dentro' : 'fuera';
  dibujar(n, [[0, o.j]], {animar:'todo', marcas});
  leyenda(`1🤝${o.j+1}: <span style="color:var(--cian)">${o.i} adentro</span> · <span style="color:var(--rosa)">${o.d} afuera</span>`);
  const vis = sumadas ?? ops.length, acum = ops.slice(0, vis).reduce((s, x) => s + x.a*x.b, 0);
  document.querySelectorAll('.opcion').forEach((b, k) => {
    b.classList.toggle('on', k === idx);
    b.classList.toggle('sumada', sumadas !== undefined && k < vis);
  });
  $('#fSuma').innerHTML = ops.map((x, k) => `<span class="t ${k < vis ? '' : 'apagado'}">${fmt(x.a*x.b)}</span>`).join(' + ')
    + ` = <span class="tot">${vis === ops.length ? `${fmt(acum)} = C(${n})` : `${fmt(acum)} …`}</span>`;
}
function irSumando(){
  if (S.form.sumando){ pararTodo(); $('#fIr').textContent = '▶ Ir sumando'; return; }
  const total = opcionesFormula(S.n).length;
  pararTodo();
  S.form.sumando = true;
  $('#fIr').textContent = '⏸ Pausa';
  let idx = 0;
  formulaElegir(0, 1);
  const fin = () => { pararTodo(); $('#fIr').textContent = '▶ Ir sumando'; };
  if (total === 1) return fin();
  cada(() => {
    idx++;
    formulaElegir(idx, idx + 1);
    if (idx === total - 1) fin();
  }, 1300);
}

/* ======================================================================
   VISTA 5: CRECIMIENTO
   ====================================================================== */
function vistaCrecimiento(){
  const datos = rango(13).map(n => ({n, v:catalan(n)}));
  const A = $('#ancho');
  A.className = 'ancho vidrio';
  A.innerHTML = `
    <div class="crec-top">
      <h2>¿Qué tan rápido crecen? 📈</h2>
      <button class="btn prim" id="cEsc"></button>
    </div>
    <div class="grafica-scroll">
      <div class="grafica" id="cGraf">${datos.map(d => `<div class="col ${d.n >= 1 && d.n <= 7 ? 'vista' : ''}" data-n="${d.n}"><div class="val">${fmt(d.v)}</div><div class="barra-v" data-v="${d.v}" style="transition-delay:${d.n*.06}s"></div></div>`).join('')}</div>
      <div class="ejes">${datos.map(d => `<div>n=${d.n}<small>${2*d.n} pers.</small></div>`).join('')}</div>
    </div>
    <p class="nota"><i style="background:linear-gradient(var(--ambar),var(--lima))"></i> los que ya vimos en el escenario (n = 1 a 7). Cada número es casi 4 veces el anterior.</p>
    <p class="destacado">Con 30 personas (n = 15) hay <b>${fmt(catalan(15))}</b> formas. Imposible hacerlo a mano 🚀</p>`;
  $('#cEsc').onclick = () => { S.crec.log = !S.crec.log; crecAltos(); };
  requestAnimationFrame(() => requestAnimationFrame(crecAltos)); // crecen al entrar
}
function crecAltos(){
  const barras = [...document.querySelectorAll('.barra-v')];
  if (!barras.length) return;
  const max = Math.max(...barras.map(b => +b.dataset.v));
  barras.forEach(b => {
    const v = +b.dataset.v;
    const f = S.crec.log ? Math.log10(v + 1) / Math.log10(max + 1) : v / max;
    b.style.height = `calc(${(f*100).toFixed(2)}% - 2.2rem * ${f.toFixed(3)})`;   // deja espacio al número de arriba
  });
  $('#cEsc').textContent = S.crec.log ? '📏 Ver escala lineal' : '🔍 Ver escala logarítmica';
  $('#cGraf').dataset.escala = S.crec.log ? 'log' : 'lineal';
}

/* ======================================================================
   VISTA 6: CÓDIGO
   ====================================================================== */
const VARIABLES = `// n → cuántos apretones hay
//     (la mitad de la gente)

// personas → la gente del círculo
//     ej. [0, 1, 2, 3]  (siempre 2n: ¡par!)

// primero → la primera de la lista:
//     ella elige con quién darse la mano

// pareja → con quién se da la mano
//     (salta de 2 en 2: k = 1, 3, 5...)

// dentro → todas las formas de los que
//     quedaron ENTRE primero y pareja

// fuera → todas las formas de los que
//     quedaron del OTRO lado

// formas → la respuesta: cada forma de
//     dentro combinada con cada una de fuera`;
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function resaltar(src){
  const re = /(\/\/[^\n]*)|\b(function|return|const|let|for|if|of|new)\b|\b(\d+)\b|\b(combinaciones|catalan|generar|Math)\b/g;
  let out = '', last = 0, m;
  while ((m = re.exec(src))){
    out += esc(src.slice(last, m.index));
    out += `<span class="${m[1] ? 'c' : m[2] ? 'k' : m[3] ? 'n' : 'f'}">${esc(m[0])}</span>`;
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}
function vistaCodigo(){
  const A = $('#ancho');
  A.className = '';
  // Function.prototype.toString(): el texto de las funciones que REALMENTE corren
  const tarjetas = [
    {t:'La fórmula 🧮', f:'Combinaciones de 2n tomando n, dividido para n+1', src:combinaciones.toString() + '\n\n' + catalan.toString(), cls:'', id:'cod1'},
    {t:'Las variables 🏷️', f:'¿Qué significa cada nombre?', src:VARIABLES, cls:'', id:'cod2'},
    {t:'Cómo las encuentra 🔍', f:'La primera persona elige pareja saltando de 2 en 2, y cada lado se resuelve igual', src:generar.toString(), cls:'t3', id:'cod3'}
  ];
  let filas = '';
  for (let n = 1; n <= 9; n++){
    const f = catalan(n), g = generar(rango(2*n)).length;
    filas += `<tr><td>${n}</td><td>${2*n}</td><td>${fmt(f)}</td><td>${fmt(g)}</td><td class="${f === g ? 'si' : 'no'}">${f === g ? '✔' : '✘'}</td></tr>`;
  }
  A.innerHTML = `
    <div class="tarjetas">${tarjetas.map(c => `
      <article class="tarjeta vidrio ${c.cls}"><h2>${c.t}</h2><p class="frase">${c.f}</p><pre class="code" id="${c.id}">${resaltar(c.src)}</pre></article>`).join('')}
    </div>
    <div class="prueba vidrio">
      <h2>Probar en vivo ⚡</h2>
      <div class="tabla-scroll"><table>
        <thead><tr><th>n</th><th>personas</th><th>Fórmula<br><small>catalan(n)</small></th><th>Generador<br><small>generar(...).length</small></th><th>✔</th></tr></thead>
        <tbody id="tablaVivo">${filas}</tbody>
      </table></div>
    </div>`;
}

/* ======================================================================
   Navegación y eventos
   ====================================================================== */
const VISTAS = {ver:vistaVer, juego:vistaJuego, adivina:vistaAdivina, formula:vistaFormula, crecimiento:vistaCrecimiento, codigo:vistaCodigo};
function render(){
  pararTodo();
  document.body.dataset.tab = S.tab;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  const ancho = S.tab === 'crecimiento' || S.tab === 'codigo';
  $('#dos').classList.toggle('oculto', ancho);
  $('#ancho').classList.toggle('oculto', !ancho);
  if (ancho) { $('#panel').innerHTML = ''; $('#stage').innerHTML = ''; } else $('#ancho').innerHTML = '';   // sin restos ocultos en el DOM
  VISTAS[S.tab]();
  serie();
  const sec = ancho ? $('#ancho') : $('#panel');
  sec.classList.remove('entra'); void sec.offsetWidth; sec.classList.add('entra');
}
$('#tabs').onclick = e => {
  const b = e.target.closest('.tab');
  if (b && b.dataset.tab !== S.tab){ S.tab = b.dataset.tab; history.replaceState(null, '', '#' + S.tab); render(); }
};
if (VISTAS[location.hash.slice(1)]) S.tab = location.hash.slice(1);   // ej. index.html#juego
window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (VISTAS[t] && t !== S.tab){ S.tab = t; render(); } });
// chips de n (delegación en el panel)
$('#panel').addEventListener('click', e => {
  const c = e.target.closest('[data-n]');
  if (c && +c.dataset.n !== S.n){ S.n = +c.dataset.n; S.ver.idx = 0; render(); }
});
// delegación en el contenedor del SVG (el SVG se regenera con innerHTML)
$('#stageWrap').addEventListener('click', e => {
  const p = e.target.closest('.persona');
  if (p && S.tab === 'juego') tocar(+p.dataset.i);
});
// atajos de teclado: solo en la pestaña Ver
document.addEventListener('keydown', e => {
  if (S.tab !== 'ver' || e.target.matches('input, textarea') || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'ArrowRight'){ e.preventDefault(); verIr(S.ver.idx + 1); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); verIr(S.ver.idx - 1); }
  else if (e.key === ' '){ e.preventDefault(); verPlay(); }   // también evita que Espacio "pulse" el botón enfocado
});
render();
</script>
